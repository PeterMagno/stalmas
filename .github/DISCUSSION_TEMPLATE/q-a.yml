body:
  - type: markdown
    attributes:
      value: |
        Need help using STALMAS? **Never paste passwords, tokens, private keys, real IPs or domains.**
        You can write in English or Spanish.
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About & legal
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Pixel 8, Android 15
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe what you tried and where you got stuck.
    validations:
      required: true
