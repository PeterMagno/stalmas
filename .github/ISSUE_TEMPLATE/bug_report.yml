name: 🐞 Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! **Do not paste passwords, tokens, IPs or domains of your servers.**
        You can write in English or Spanish.
        Tip: in the app, Settings → About & legal → "Report a problem" prepares a report with private data hidden.
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About & legal
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Pixel 8, Android 15
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Portainer (containers, stacks, logs)
        - SSH terminal
        - AI assistant
        - Monitoring
        - Backup
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or extra context
      description: Hide private data before attaching.
