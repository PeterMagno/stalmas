name: 💡 Idea
description: Suggest an improvement or a new feature.
labels: ["idea"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      placeholder: When I ..., I can't ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: How do you do it today?
      description: For example, in the Portainer web UI or over SSH.
