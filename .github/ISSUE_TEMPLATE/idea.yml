name: 💡 Idea
description: Suggest an improvement or a new feature. / Propón una mejora o una función nueva.
labels: ["idea"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve? / ¿Qué problema resolvería?
      placeholder: When I ..., I can't ... / Cuando ..., no puedo ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How would you like it to work? / ¿Cómo te gustaría que funcionara?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: How do you do it today? / ¿Cómo lo haces hoy?
      description: For example, in the Portainer web UI or over SSH. / Por ejemplo, en la web de Portainer o por SSH.
